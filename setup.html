<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create admin account · Video Studio</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo-dot"></span> Video Studio
    </div>
    <p class="auth-sub">First run — create your admin account. This is a private single-user app; there is no sign-up for anyone else.</p>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post" class="auth-form">
      <label>Username</label>
      <input type="text" name="username" required autofocus>
      <label>Password</label>
      <input type="password" name="password" required minlength="6">
      <label>Confirm password</label>
      <input type="password" name="confirm" required minlength="6">
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>
  </div>
</body>
</html>
