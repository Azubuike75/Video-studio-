<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Studio · Dashboard</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo-dot"></span> Video Studio</div>
  <div class="topbar-right">
    <span class="username">{{ username }}</span>
    <a href="{{ url_for('logout') }}" class="btn btn-ghost btn-sm">Logout</a>
  </div>
</header>

<main class="layout">
  <!-- Generate panel -->
  <section class="panel" id="generate-panel">
    <h2>Generate videos</h2>

    <div class="field">
      <label>Category</label>
      <div class="chip-group" id="category-group">
        {% for c in categories %}
          <button type="button" class="chip {{ 'chip-active' if loop.first }}" data-category="{{ c }}">{{ c|capitalize }}</button>
        {% endfor %}
      </div>
    </div>

    <div class="field">
      <label>Topic</label>
      <div class="topic-row">
        <input type="text" id="topic-input" placeholder="e.g. discipline, coffee, chess... (leave blank for Random)">
        <button type="button" class="btn btn-ghost btn-sm" id="random-btn">🎲 Random</button>
      </div>
    </div>

    <div class="field">
      <label>Format (select one or more)</label>
      <div class="chip-group" id="aspect-group">
        {% for a in aspects %}
          <button type="button" class="chip {{ 'chip-active' if loop.first }}" data-aspect="{{ a }}">
            {{ a|capitalize }}
            <span class="chip-sub">
              {%- if a == 'vertical' %} 9:16{% elif a == 'square' %} 1:1{% else %} 16:9{% endif -%}
            </span>
          </button>
        {% endfor %}
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Quantity</label>
        <input type="number" id="quantity-input" value="1" min="1" max="200">
      </div>
      <div class="field">
        <label>Duration (sec)</label>
        <input type="number" id="duration-input" value="8" min="4" max="20">
      </div>
    </div>

    <button type="button" class="btn btn-primary btn-block" id="queue-btn">Add to queue</button>
    <p class="hint" id="queue-feedback"></p>
  </section>

  <!-- Queue status panel -->
  <section class="panel" id="queue-panel">
    <div class="panel-header-row">
      <h2>Queue</h2>
      <div class="counts" id="queue-counts"></div>
    </div>
    <div class="queue-list" id="queue-list"><p class="empty-state">No jobs yet.</p></div>
  </section>

  <!-- Gallery panel -->
  <section class="panel panel-wide" id="gallery-panel">
    <div class="panel-header-row">
      <h2>Saved videos</h2>
      <select id="gallery-filter">
        <option value="all">All categories</option>
        {% for c in categories %}<option value="{{ c }}">{{ c|capitalize }}</option>{% endfor %}
      </select>
    </div>
    <div class="gallery-grid" id="gallery-grid"><p class="empty-state">No videos generated yet.</p></div>
  </section>
</main>

<!-- Preview modal -->
<div class="modal" id="preview-modal">
  <div class="modal-content">
    <button class="modal-close" id="modal-close">&times;</button>
    <video id="modal-video" controls playsinline></video>
    <div class="modal-info" id="modal-info"></div>
    <div class="modal-actions">
      <a id="modal-download" class="btn btn-primary" download>Download</a>
      <button class="btn btn-ghost" id="modal-delete">Delete</button>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
